<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Калькулятор стоимости заказа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container my-4">
    <section id="calculator" class="p-3">
        <h2>Калькулятор стоимости заказа</h2>

        <form id="calculator-form">
            <fieldset class="border-0 p-0 m-0">
                <legend class="fs-6 fw-bold">Выберите тип товара:</legend>

                <p>
                    <input type="radio" id="notebook" name="product" value="notebook" checked>
                    <label for="notebook">Тетрадь — 100 руб.</label>
                </p>

                <p>
                    <input type="radio" id="pen" name="product" value="pen">
                    <label for="pen">Ручка</label>
                </p>

                <p>
                    <input type="radio" id="book" name="product" value="book">
                    <label for="book">Книга — 500 руб.</label>
                </p>
            </fieldset>

            <div id="option-container" class="mt-3" hidden>
                <label for="option" class="form-label">Выберите ручку:</label>
                <select id="option" class="form-select w-auto">
                    <option value="50">Шариковая — 50 руб.</option>
                    <option value="80">Гелевая — 80 руб.</option>
                    <option value="120">Набор из трёх ручек — 120 руб.</option>
                </select>
            </div>

            <div id="property-container" class="mt-3" hidden>
                <input type="checkbox" id="gift-wrap">
                <label for="gift-wrap">
                    Подарочная упаковка (+50 руб. за книгу)
                </label>
            </div>

            <div class="mt-3">
                <label for="quantity" class="form-label">Количество товара:</label>
                <br>
                <input type="number" id="quantity" class="form-control w-auto" min="1" step="1" value="1" required>
            </div>
        </form>

        <p id="message" class="mt-3" aria-live="polite"></p>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
